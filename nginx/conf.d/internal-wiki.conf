# Корпоративная wiki (ai-box-template-wiki-global) — внутренний вход для
# сервисов экосистемы, наружу не публикуется. Порт 8086 не проброшен на хост:
# доступен только с сети ecosystem, потребители ходят на http://gateway:8086
# (alias сервиса nginx) — например MCP-обёртка wiki-тулов и бек ai-box.
#
# Публичный вход тот же контейнер получает через api-vhost, location /wiki/.
# Здесь префикса нет: маршруты приложения корневые (/api/incoming,
# /api/wiki/<code>/manifest, /api/ingest/status, /healthz).

server {
    listen 8086;
    server_name _;

    access_log /var/log/nginx/wiki.access.log;
    error_log  /var/log/nginx/wiki.error.log;

    # Приём материалов: файл до 25 МБ + запас на заголовки.
    client_max_body_size 40M;

    resolver 127.0.0.11 valid=10s;
    set $wiki_upstream ai-box-wiki-web:8080;

    location / {
        proxy_pass http://$wiki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
