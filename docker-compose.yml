name: ai_box_infra

# Shared-стек экосистемы AiBox: вход (nginx+TLS), MariaDB, Redis, Qdrant,
# browserless. Приложения живут в своих репозиториях и подключаются к
# внешней сети `ecosystem` (создаётся этим стеком, attachable).
#
# Контракт имён на сети ecosystem (используются в nginx/conf.d/*):
#   ai-box-php:9000        — php-fpm приложения ai-box
#   ai-box-dr-php:9000     — php-fpm приложения ai-box-data-registry
#   ai-box-mcp-php:9000    — php-fpm приложения ai-box-mcp
# Инфра-сервисы доступны приложениям по именам: mariadb, redis, qdrant,
# browserless, gateway (внутренние vhost'ы DR/MCP на 8083/8084).

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: infra_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домены копии: entrypoint официального образа прогоняет
      # nginx/templates/*.template через envsubst → conf.d (домены и путь
      # сертификата параметризованы, вторая копия живёт на своих доменах).
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN обязателен}
      FRONT_DOMAIN: ${FRONT_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      # Внешний контур раннеров полигона MCP (mcp.<домен>) — есть не на каждом
      # стенде: не задан → инертный дефолт, vhost рендерится, но не матчится
      # ничем (тот же приём, что LANDING_DOMAIN ниже).
      MCP_DOMAIN: ${MCP_DOMAIN:-mcp.invalid}
      CERT_NAME: ${CERT_NAME:-${ROOT_DOMAIN}}
      # Адрес внешнего ASR-сервиса (поток голосовой диктовки) для envsubst →
      # proxy_pass в api-шаблоне. Значение per-stend в .env; не задан → инертный
      # дефолт (локация рендерится и nginx стартует, но проксировать некуда —
      # реально активна она лишь после успешного auth_request, т.е. когда голос
      # включён в самом ai-box). Так добавление голоса не требует новой
      # ОБЯЗАТЕЛЬНОЙ переменной на стендах без voice.
      ASR_WS_UPSTREAM: ${ASR_WS_UPSTREAM:-127.0.0.1:9}
      # Развилка корневого домена: лендинг (root-landing.conf.template) против
      # 301 на app (root-redirect.conf.template). Дефолты — заведомо
      # несуществующие домены: невыбранный vhost рендерится, но не матчится
      # ничем. Дефолты обязаны быть здесь — envsubst в шаблоне синтаксис
      # ${VAR:-default} не понимает (тот же приём, что у ASR_WS_UPSTREAM).
      LANDING_DOMAIN: ${LANDING_DOMAIN:-landing.invalid}
      ROOT_REDIRECT_DOMAIN: ${ROOT_REDIRECT_DOMAIN:-root-redirect.invalid}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # Код приложений: пути внутри nginx обязаны совпадать с путями внутри
      # php-fpm контейнеров (SCRIPT_FILENAME = $document_root$fastcgi_script_name).
      - ${APPS_ROOT:-/var/www}/ai-box:/var/www/ai-box:ro
      # Фронт — монтируем РОДИТЕЛЬ, а не сам dist: если фронт деплоят
      # release-схемой (dist → symlink на releases/<ts>), bind-mount самого
      # dist разрезолвил бы symlink на момент старта контейнера и застрял бы на
      # старом релизе (нужен рестарт nginx). Монтируя родителя, nginx резолвит
      # symlink `dist` пер-запрос — свопы релизов долетают без рестарта. Для
      # rsync-in-place (doitai: rsync в реальный dist/) тоже работает.
      - ${APPS_ROOT:-/var/www}/ai-box-front:/var/www/ai-box-front:ro
      # Лендинг (репозиторий ai-box-site, rsync из CI, сборки нет). На стендах
      # без лендинга docker создаст пустой каталог — безвредно, vhost там всё
      # равно не матчится.
      - ${APPS_ROOT:-/var/www}/ai-box-site:/var/www/ai-box-site:ro
      - ${APPS_ROOT:-/var/www}/ai-box-data-registry:/var/www/ai-box-data-registry:ro
      - ${APPS_ROOT:-/var/www}/ai-box-mcp:/var/www/ai-box-mcp:ro
    networks:
      ecosystem:
        aliases:
          - gateway

  # Одноразовые запуски через Makefile (certs-init/certs-renew); в фоне не работает.
  certbot:
    image: certbot/certbot:latest
    profiles: [certs]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - ecosystem

  mariadb:
    image: mariadb:11.8
    container_name: infra_mariadb
    restart: unless-stopped
    # buffer_pool — под RAM хоста через .env (MARIADB_BUFFER_POOL): doitai 16G
    # → 4G, addons-прод — своё значение; дефолт 512M безопасен для любого хоста.
    # Остальной тюнинг — в mariadb/my.cnf. Args идут в mysqld поверх my.cnf.
    command: --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL:-512M}
    # Только loopback хоста — для ручного администрирования; приложения ходят по сети.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD обязателен}
      # Пароли app-пользователей читает mariadb/initdb/01-apps.sh при первом старте
      AI_BOX_DB_PASSWORD: ${AI_BOX_DB_PASSWORD:?}
      AI_BOX_DR_DB_PASSWORD: ${AI_BOX_DR_DB_PASSWORD:?}
      AI_BOX_MCP_DB_PASSWORD: ${AI_BOX_MCP_DB_PASSWORD:?}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - ecosystem

  redis:
    image: redis:7.4-alpine
    container_name: infra_redis
    restart: unless-stopped
    # maxmemory-policy volatile-lru: под давлением памяти вытесняются ТОЛЬКО
    # ключи с TTL (кэш Laravel), а очереди (jobs — без TTL) не теряются.
    # maxmemory — граница против OOM, под RAM хоста через .env (дефолт 512mb).
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - ecosystem

  qdrant:
    # Версия цели ОБЯЗАНА быть >= версии источника данных (даунгрейд storage
    # не поддерживается). Перед миграцией сверить фактическую версию
    # qdrant-источника (GET /) и задать QDRANT_VERSION в .env.
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.12.4}
    container_name: infra_qdrant
    restart: unless-stopped
    # Наружу не светим; loopback — для ручной диагностики.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecosystem

  browserless:
    image: browserless/chrome:latest
    container_name: infra_browserless
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN обязателен}
      MAX_CONCURRENT_SESSIONS: 5
      CONNECTION_TIMEOUT: 30000
      MAX_QUEUE_LENGTH: 10
      PREBOOT_CHROME: "true"
    networks:
      - ecosystem

  neo4j:
    # Граф-хранилище knowledge реестра. Стоковый образ, БЕЗ NEO4J_PLUGINS:
    # плагин GDS ставим сами в neo4j/plugins (make neo4j-plugins, пин+sha256).
    # Версия Neo4j↔GDS пинится согласованно (5.26.x ↔ GDS 2.13.x).
    image: neo4j:${NEO4J_VERSION:-5.26.28-community}
    container_name: infra_neo4j
    restart: unless-stopped
    # Наружу не светим; loopback — ручная диагностика (Bolt + Neo4j Browser).
    # Приложения ходят по сети ecosystem на neo4j:7687 напрямую.
    ports:
      - "127.0.0.1:7687:7687"   # Bolt (клиенты, cypher-shell)
      - "127.0.0.1:7474:7474"   # HTTP Neo4j Browser (диагностика)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD обязателен}
      # Слушать интерфейс контейнера, чтобы app-контейнеры на ecosystem достучались
      # (наружу закрыто loopback-публикацией, как mariadb/qdrant).
      NEO4J_server_default__listen__address: 0.0.0.0
      # GDS требует unrestricted, иначе процедуры gds.* не грузятся.
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      # Память под RAM хоста (.env; дефолты малы и безопасны — как MARIADB_BUFFER_POOL).
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
      - ./neo4j/plugins:/plugins:ro   # jar кладёт make neo4j-plugins; ro — Neo4j только читает
    networks:
      - ecosystem

  # php-fpm обработчика контактной формы лендинга (api/contact-form.php в
  # репозитории ai-box-site). SMTP-креды — env/<стенд>/secrets.env.
  landing-php:
    image: aibox/php-base:8.3
    container_name: landing-php
    restart: unless-stopped
    working_dir: /var/www/ai-box-site
    volumes:
      - ${APPS_ROOT:-/var/www}/ai-box-site:/var/www/ai-box-site:ro
      - ./landing-php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-landing.conf:ro
    environment:
      SMTP_HOST: ${LANDING_SMTP_HOST:-}
      SMTP_PORT: ${LANDING_SMTP_PORT:-465}
      SMTP_SECURE: ${LANDING_SMTP_SECURE:-ssl}
      SMTP_USER: ${LANDING_SMTP_USER:-}
      SMTP_PASS: ${LANDING_SMTP_PASS:-}
      MAIL_FROM: ${LANDING_MAIL_FROM:-}
      MAIL_TO: ${LANDING_MAIL_TO:-sales@doitai.ru}
    networks:
      - ecosystem

volumes:
  mariadb_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  letsencrypt:
  certbot_webroot:

networks:
  ecosystem:
    name: ecosystem
    driver: bridge
    attachable: true
    # Фиксированная подсеть: стабильный gateway-IP — адрес хоста для
    # контейнеров, если что-то останется вне докера на хосте (ollama-пул),
    # и предсказуемые правила firewall. Перед запуском проверить занятость
    # диапазона (`ip route`) и при пересечении задать свой в .env.
    ipam:
      config:
        - subnet: ${ECOSYSTEM_SUBNET:-172.30.0.0/24}
          gateway: ${ECOSYSTEM_GATEWAY:-172.30.0.1}
